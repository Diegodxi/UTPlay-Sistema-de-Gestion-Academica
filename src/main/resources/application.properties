spring.application.name=UTPlay
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/utplay_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA valida que el esquema coincida con las entidades. La creacion se realiza con database/utplay_db.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Seguridad. En produccion se debe establecer JWT_SECRET con al menos 32 caracteres aleatorios.
app.jwt.secret=${JWT_SECRET:UTPlay-Clave-Local-Segura-2026-Cambiar-En-Produccion}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:8080}

# Respuestas JSON consistentes
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Lima
